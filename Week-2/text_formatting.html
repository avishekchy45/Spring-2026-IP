<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Main Heading</h1>

    <h2>Sub Heading</h2>

    <p>This is a paragraph.</p>

    <br>

    <hr>

    <strong>Important Text</strong>
    <!-- Used for warnings, critical deadlines, or severe errors. Helps search engines identify crucial keywords. -->

    <b>Bold text</b>
    <!-- Used for keywords in a summary, product names. Little to no direct impact on keyword ranking-->

    <hr>

    <em>Emphasized text</em>
    <!-- Used for emphasis, stress, or importance. Helps search engines identify crucial keywords. -->

    <i>Italic text</i>
    <!-- Used for technical terms, foreign words, or phrases. Little to no direct impact on keyword ranking-->

    <hr>

    <mark>Highlighted text</mark>

    <hr>

    <small>Small text</small>

    <hr>

    <p>H<sub>2</sub>O</p>

    <p>x<sup>2</sup></p>

    <hr>

    <blockquote>
        Learning HTML is fun.
    </blockquote>

    <hr>

    <code>
        print("Hello World")
    </code>

    <hr>

    <details open>
        <summary>Click to expand</summary>
        This is the hidden content. You can use standard Markdown here.
    </details>


</body>

</html>
